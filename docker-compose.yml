
version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongodb:
    image: mongo:5
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper

  customer-service:
    build: ./customer-service
    ports:
      - "8001:8001"
    depends_on:
      - db

  policy-service:
    build: ./policy-service
    ports:
      - "8002:8002"
    depends_on:
      - db

  claim-service:
    build: ./claim-service
    ports:
      - "8003:8003"
    depends_on:
      - mongodb

  payment-service:
    build: ./payment-service
    ports:
      - "8004:8004"
    depends_on:
      - db

  notification-service:
    build: ./notification-service
    ports:
      - "8005:8005"
    depends_on:
      - kafka

  fraud-detection-service:
    build: ./fraud-detection-service
    ports:
      - "8006:8006"

  document-service:
    build: ./document-service
    ports:
      - "8009:8001"

  agent-management-service:
    build: ./agent-management-service
    ports:
      - "8010:8008"
    depends_on:
      - db

  customer-ui:
    build: ./customer-ui
    ports:
      - "3000:3000"

  admin-ui:
    build: ./admin-ui
    ports:
      - "8081:80"
